services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set database root password in .env}
      MARIADB_DATABASE: ${DB_NAME:-sgtglob1_Test}
      MARIADB_USER: ${DB_USER:-tormorgroup}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set application database password in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-sgtglob1_Test}
      DB_USER: ${DB_USER:-tormorgroup}
      DB_PASSWORD: ${DB_PASSWORD:?Set application database password in .env}
      DB_DRIVER: mysql
      APP_ROOT: ${APP_ROOT:-}
    volumes:
      - ./:/var/www/html

volumes:
  db_data:
